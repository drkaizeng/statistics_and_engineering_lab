site_name: Kai's statistics & engineering lab
docs_dir: src

theme:
  name: material
  features:
    - content.code.copy
    - toc.follow

# Test localling using `mkdocs serve -f mkdocs.yml`

nav:
  - Home: index.md
  - Statistical genetics:
      - Fine-mapping with SuSiE: statistical_genetics/fine_mapping_with_susie.md
      - Linear mixed models: statistical_genetics/linear_mixed_models.md
  - Python projects:
      - Linear regression: python_projects/linear_regression.md
      - Mendelian randomisation: python_projects/mendelian_randomisation.md
  - Rust projects:
      - Introduction: rust_projects/introduction.md
      - Linear regression: rust_projects/linear_regression.md

plugins:
  - search
  - kroki

markdown_extensions:
  - attr_list
  # Enable highlighted note/important blocks
  - admonition
  - pymdownx.arithmatex: # for rendering LaTeX math
      generic: true
  # For enabling checkboxes in task lists
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed: # for enabling tabbed contents
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript: # for rendering LaTeX math
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
